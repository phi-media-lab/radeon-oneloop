[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "radeon-oneloop"
version = "1.0.0"
description = "Single-Radeon phase-aware bimanual handover evidence pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Phi Media Lab"}]
dependencies = ["numpy==1.26.4", "PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
data = ["pandas>=2.2,<3", "pyarrow>=17,<24"]
test = ["pytest>=8.3,<9"]

[project.scripts]
oneloop-hash-tree = "radeon_oneloop.artifact_hash:main"
oneloop-build-targets = "radeon_oneloop.phase_targets:main"
oneloop-train-command = "radeon_oneloop.train_command:main"
oneloop-merge-data = "radeon_oneloop.data_merge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
